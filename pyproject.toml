[project]
name = "docwhere"
version = "0.1.0"
description = "Full-text search across PDF and Office documents, down to the section, then jump to the hit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
docwhere = "docwhere.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
